name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install NDK + SDK platforms
        run: |
          set -o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;28.2.13676358" || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" || true
          sdkmanager --install "platforms;android-36"   "build-tools;36.0.0" || true
          echo "===== AVAILABLE SDK ====="
          ls -d $ANDROID_HOME/platforms/* $ANDROID_HOME/build-tools/* 2>/dev/null || true
          echo "===== AVAILABLE NDK ====="
          ls -d $ANDROID_HOME/ndk/* 2>/dev/null || true
      - name: Setup NDK toolchain
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "ANDROID_NDK_HOME=$NDK"     >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK"     >> $GITHUB_ENV
          echo "NDK_TOOLCHAIN=$TOOLCHAIN"  >> $GITHUB_ENV
          echo "PATH=$TOOLCHAIN/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN/bin/clang"   >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/clang++" >> $GITHUB_ENV
          echo "LD=$TOOLCHAIN/bin/ld.lld"  >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "===== clang check ====="
          which clang || true
          clang --version || true
          echo "===== sysroot check ====="
          ls "$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/21/crtbegin_so.o" 2>/dev/null || echo "crtbegin_so.o NOT FOUND at expected path"
          echo "===== -llog check ====="
          find "$TOOLCHAIN/sysroot" -name "liblog.so" 2>/dev/null | head -3 || true
      - name: Cache Gradle + NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.nuget/packages
          key: build-${{ runner.os }}-${{ hashFiles('src/KenjinxAndroid/**/*.gradle*', 'src/**/*.csproj', 'global.json', 'nuget.config') }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: chmod gradlew
        run: chmod +x src/KenjinxAndroid/gradlew
      - name: Build
        working-directory: src/KenjinxAndroid
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          NUGET_HTTP_TIMEOUT_SECONDS: "15"
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Porg.kenjinx.llvm.toolchain.path="$NDK_TOOLCHAIN" \
            -Porg.kenjinx.llvm.toolchain.path.bin="$NDK_TOOLCHAIN/bin" \
            -Pandroid.ndkVersion=28.2.13676358
      - name: Locate APK
        if: always()
        run: find src/KenjinxAndroid -name "*.apk" -type f -ls 2>/dev/null | head -20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: kenjinx-debug-apk-${{ github.sha }}
          path: src/KenjinxAndroid/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
