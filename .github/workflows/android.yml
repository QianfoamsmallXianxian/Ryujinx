name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: NuGet diagnostics
        run: |
          cat nuget.config
          dotnet nuget list source || true
      - name: Cache Gradle + NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.nuget/packages
          key: build-${{ runner.os }}-${{ hashFiles('src/KenjinxAndroid/**/*.gradle*', 'src/**/*.csproj', 'global.json', 'nuget.config') }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: chmod gradlew
        run: chmod +x src/KenjinxAndroid/gradlew
      - name: Build
        working-directory: src/KenjinxAndroid
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
          NUGET_HTTP_TIMEOUT_SECONDS: "15"
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Locate APK
        if: always()
        run: find src/KenjinxAndroid -name "*.apk" -type f -ls 2>/dev/null | head -20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: kenjinx-debug-apk-${{ github.sha }}
          path: src/KenjinxAndroid/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
